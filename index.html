<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enigma Station: an Enigma I simulator</title>
    <meta
      name="description"
      content="An accurate Enigma I simulator that runs in your browser. Set rotors, rings and plugboard, watch the signal path and the double step, and encrypt or decrypt messages."
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314130f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23c9a24d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffd86b'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before first paint so there is no flash. Dark is the default.
      try {
        if (localStorage.getItem('enigma-station:theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to the machine</a>
    <header class="site-header">
      <div class="wrap header-row">
        <div>
          <h1>Enigma Station</h1>
          <p class="tagline">A faithful Enigma I, in your browser.</p>
        </div>
        <button type="button" id="theme-toggle" class="btn" aria-pressed="false">Light theme</button>
      </div>
    </header>
    <main id="main" class="wrap">
      <div id="app">
        <noscript><p class="error">Enigma Station needs JavaScript to run the machine.</p></noscript>
        <p class="muted">Loading…</p>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <p>
          Educational simulator of the German Army and Air Force Enigma I (rotors I–V, reflectors A–C). Not a secure
          cipher. Everything runs locally in your browser; nothing is sent anywhere.
        </p>
      </div>
    </footer>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
